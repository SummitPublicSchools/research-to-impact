# Netlify build configuration for Research to Impact.
# The build pulls the Google Sheet and writes dist/index.html.
[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"        # Node 18+ required (global fetch). 20 is safe.
  # SHEET_ID is read from build.js by default. To point at a different sheet
  # without editing code, set a SHEET_ID environment variable in the Netlify UI.

# Ask the Resources (netlify/functions/ask.mjs) answers a visitor's question by
# routing it to one resource. It needs ANTHROPIC_API_KEY set in the Netlify UI
# (Site configuration -> Environment variables); without it the endpoint returns
# a 503 and the page falls back to plain search, which is the intended
# degradation rather than a bug.
#
# The corpus it reasons over is netlify/functions/corpus-data.mjs, generated by
# build.js on every build and imported by the function, so esbuild inlines it.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
