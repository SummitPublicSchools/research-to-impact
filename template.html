<!DOCTYPE html>

<meta name="twitter:title" content="__SEO_TITLE__"/>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Marshall Street brand. Source of truth: marshall-design-system/brand/tokens.json,
   from the Marshall Street Brand Guidelines v1.0 (July 2026), palette p.13, type p.15.
   Three rules constrain everything below:
     - Only navy and black carry body text. Blue is for 24px and up.
       Orange, teal and light blue are FILL colours and never carry small text.
       The one exception is an orange eyebrow label above a navy heading.
     - Figtree only: Light 300 for display, SemiBold 600 for headings, Regular 400 for body.
     - Flat. No gradients, no drop shadows, no rounded photo corners.
   Do not hand-pick a hex here; change tokens.json and re-run its build. */
:root{
  --navy:#21334c; --orange:#ed8f47; --blue:#3d87f5; --lightblue:#b9dce6; --teal:#5cc2a1;
  --orange-d:#e07f33;
  --white:#ffffff; --slate:#f1f8fa; --sunken:#e9ebed;
  --ink:#21334c; --muted:#4d5c70; --gray:#7a8594;
  --accent:#b9dce6; --line:#d3d6db;
  --ok-bg:#def3ec; --ok-tx:#1d6e46; --soon-bg:#e9ebed; --soon-tx:#4d5c70;
  /* Retired: the old brand's coral. Aliased to orange so nothing is left pointing
     at a colour outside the palette. Fold these call sites in when convenient. */
  --coral:#ed8f47; --coral-d:#e07f33;

  /* ---- Scales ----------------------------------------------------------
     Before these existed the stylesheet carried 30 distinct font sizes, five
     weights, 15 corner radii and a dozen gap values — 7px, 8px and 9px gaps
     side by side, 13px type at three different weights. None of it was wrong
     on its own; together it read as approximate, which is what reads as
     dated. Everything below snaps to these. If a new value is needed, add a
     step here rather than a one-off at the call site.

     Type: seven steps, each a perceptible jump from the last. Three weights,
     which is the brand's own limit (spec §3) — 500 and 700 are gone. */
  --t-label:12px; --t-meta:14px; --t-body:16px; --t-heading:18px; --t-sub:22px;
  --t-title:28px;
  --t-display:clamp(28px,4vw,44px);   /* page h1 */
  --t-stat:clamp(26px,3.2vw,34px);    /* the proof-band numbers */
  --w-light:300; --w-body:400; --w-semi:600;

  /* Spacing: a 4px scale. */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-6:24px; --s-8:32px; --s-12:48px;

  /* Radius: cards, controls, and true pills. 50% stays for circular badges. */
  --r-card:14px; --r-ctl:8px; --r-pill:999px;

  /* Running text: long lines are what make a page feel like a wall. Body copy
     was 14px across 98 characters; 45-75 is the comfortable range.
     NOTE 1ch is the width of "0", not of an average character — in Figtree at
     16px that is 10.25px against an average nearer 8. 68ch measured out at 86
     real characters; 54ch lands around 68, which is what this is set from. */
  --measure:54ch;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Figtree','Helvetica Neue',Helvetica,Arial,sans-serif;color:var(--ink);background:var(--slate);line-height:1.5;-webkit-font-smoothing:antialiased}
/* Display role (p.15): Figtree Light. The class name is historical — it is no longer
   a serif. Weight and scale carry the hierarchy now, not a second family. */
.serif{font-family:inherit;font-weight:var(--w-light);line-height:1.06;letter-spacing:-.015em}
/* Headings default to the browser's bold (700), which is a fourth weight the
   brand does not use — the toolkit card h3s were rendering at 700 purely by
   inheritance. Set them to the semi step; .serif (the Light display role)
   still wins on the elements that carry it, being a class. */
h1,h2,h3,h4,h5,h6{font-weight:var(--w-semi)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* One timing for every state change. Before this, cards eased over .12s while
   buttons, nav links and menu rows snapped — the page answered the mouse in two
   different ways. A rule that sets its own transition still wins; this is the
   floor for everything that had none. */
a,button,.chip,input{transition:background-color .15s ease,color .15s ease,border-color .15s ease,box-shadow .15s ease,transform .15s ease,opacity .15s ease}
/* Pressed: every filled or outlined button settles 1px on mouse-down. */
.btn:active,.dl:active,#findBtn:active,#menuBtn:active,footer .signup button:active{transform:translateY(1px)}

/* The "site under development" strip that used to sit above the header is gone,
   along with its .protostrip rules. It was hedging against the defects the
   design plan listed — no phone navigation, grey hero boxes, two empty sections
   in the nav — and those are fixed. The plan's own instruction was to fix them
   and take the banner down rather than reword it. It was hardcoded here rather
   than sheet-driven, so putting a notice back is a code change; if the team
   wants one they can hold, it belongs on the Site tab as an editable setting. */

header.site{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:var(--s-4);padding:8px 22px;min-height:62px;box-shadow:0 1px 0 rgba(0,0,0,.15)}
/* The logo file is cropped to the artwork (marshall-secondary-cw-tight.png).
   The uncropped export carries its own clear space inside the image — the
   letters were 51% of the file's height — so at 30px tall the wordmark rendered
   about 12px high and the lever M closed up. Cropped, a 24px image gives 20px
   letters, and the box a keyboard focus ring draws is the logo, not its padding.
   Clear space (brand p.6: the cap height of the S, all sides) now comes from
   the header's own padding and the margin here. */
header .logo{height:24px;display:flex;align-items:center;margin-right:8px;flex:0 0 auto;border-radius:2px}
header .logo:focus-visible{outline-offset:6px}
header .logo:hover{opacity:.85}
header .logo img{height:24px;width:auto;display:block}
/* Nav type was 12px, the smallest text on the site doing the most important
   job. It is 14px now, and each item is a padded target with a soft fill on
   hover: the old hover changed #dfe6ee to #fff, which nobody could see. The
   current page keeps its orange rule, drawn as a pseudo-element so it sits
   inside the rounded target instead of bending round its corners. */
nav.main{display:flex;gap:2px;flex:1;flex-wrap:nowrap;align-items:center;min-width:0}
nav.main a{position:relative;font-size:var(--t-meta);color:#dfe6ee;padding:7px;border-radius:var(--r-ctl);white-space:nowrap}
nav.main a:hover{color:#fff;background:rgba(255,255,255,.1)}
nav.main a.active{color:#fff}
nav.main>a.active::after,nav.main .dd>a.active::after{content:"";position:absolute;left:7px;right:7px;bottom:1px;height:2px;background:var(--orange)}
header .search{display:flex;align-items:center;gap:var(--s-2);background:rgba(255,255,255,.12);border-radius:var(--r-ctl);padding:6px 11px;color:#cdd6df;font-size:var(--t-meta)}
header .search input{background:transparent;border:0;color:#fff;font-family:inherit;font-size:var(--t-meta);width:120px;outline:none}
header .search input::placeholder{color:#aebccb}

/* The page used to be a single 1040px column: main carried the max-width and
   every block sat inside it, so nothing could ever touch the edge of the
   screen. That is what made the page read as a stack of boxes.
   main is now full width and its children are centred individually, which lets
   a block opt out with .bleed and span the viewport. Doing it this way rather
   than with the usual `width:100vw; margin-left:calc(50% - 50vw)` trick is
   deliberate: 100vw includes the scrollbar, so that version overflows by about
   15px on any desktop page tall enough to scroll — which is all of them. */
main{max-width:none;margin:0;padding:0 0 60px}
#app{padding-top:30px}
/* width:calc(100% - gutter) rather than padding, because several of these
   blocks paint their own background — the hero and the closing band are cards.
   With padding the gutter sits inside the card, so the card edge lands 22px
   further out than the toolkit cards below it. Sizing the box itself keeps
   every block's visible edge on the same line, which is what it was before
   main stopped carrying the max-width. */
#app>*{width:calc(100% - 44px);max-width:996px;margin-left:auto;margin-right:auto}
/* Higher specificity than the rule above, so no !important is needed. */
#app>.bleed{width:100%;max-width:none}
/* Re-constrains the content inside a full-bleed block to the same column, so
   only the background runs to the edge, never the text. */
.bleed-in{width:calc(100% - 44px);max-width:996px;margin:0 auto}
.crumb{font-size:var(--t-label);color:var(--muted);margin-bottom:14px}
.crumb a:hover{color:var(--navy);text-decoration:underline}
.eyebrow{font-size:var(--t-label);letter-spacing:.12em;text-transform:uppercase;color:var(--orange);font-weight:var(--w-semi);margin:0 0 10px}

/* Homepage hero. A full-bleed white band, flush under the header and joined to
   the navy proof band below: light where the reading is, navy where the proof
   is. The four-track grid keeps the text on the reading column while the photo
   runs hard-edged to the right edge of the screen: the outer tracks are the
   gutters, and the photo spans its own track plus the right-hand gutter.
   The two inner tracks are near-equal on purpose. A narrow photo track makes a
   tall thin box, and object-fit:cover then shows half of one person, enlarged
   and soft — which shipped once and was reverted. Below 900px the photo stops
   being a column at all and becomes a wide strip above the text. */
#app:has(>.hero){padding-top:0}
#app>.hero{display:grid;grid-template-columns:minmax(22px,1fr) minmax(0,510px) minmax(0,486px) minmax(22px,1fr);background:var(--white);overflow:hidden}
.hero .htext{grid-column:2;align-self:center;padding:52px 44px 48px 0}
.hero h1{color:var(--navy);font-size:var(--t-display);line-height:1.12;letter-spacing:-.01em;margin:0;max-width:20ch}
.hero .hsub{color:#41505f;font-size:var(--t-body);line-height:1.6;max-width:46ch;margin:16px 0 26px}
.hero .hacts{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-3) var(--s-6)}
.hero .hlink{color:var(--navy);font-size:var(--t-meta);font-weight:var(--w-semi);border-bottom:1px solid rgba(33,51,76,.35);padding-bottom:2px}
.hero .hlink:hover{border-bottom-color:var(--orange)}
.hero .hkits{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:30px;padding-top:16px;border-top:1px solid var(--line);font-size:var(--t-meta)}
.hero .hkits a{color:#41505f}
.hero .hkits a:hover{color:var(--navy);text-decoration:underline;text-underline-offset:4px}
.hero .himg{grid-column:3/5;position:relative;min-height:420px;overflow:hidden}
.hero .himg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:88% 40%;display:block}
.hero+.proof{margin-top:0}
@media(max-width:1200px){#app>.hero{grid-template-columns:minmax(16px,1fr) minmax(0,510px) minmax(0,486px) minmax(16px,1fr)}}
@media(max-width:899px){
  #app>.hero{grid-template-columns:16px minmax(0,1fr) 16px}
  .hero .himg{grid-column:1/-1;order:-1;min-height:0;height:min(56vw,420px)}
  .hero .htext{grid-column:2;padding:28px 0 32px}
  .hero .hkits{margin-top:24px}
}
@media(max-width:560px){.hero+.proof{border-radius:0;padding-left:0;padding-right:0}}
/* Homepage proof band — the field outcomes, directly under the hero. Navy and
   flat, and deliberately the heaviest block of colour on the page: the brand
   wants navy dominant, and these numbers are the strongest thing the site has
   to say. The eyebrow is pale rather than orange because the brand sanctions an
   orange eyebrow only above a navy heading that repeats its meaning, and here
   the eyebrow is the only label there is. */
.proof{background:var(--navy);padding:var(--s-8) 0;margin-top:var(--s-6);color:#fff}
/* An even split rather than three-and-one. Left to auto-fit, four stats become
   three columns plus a stranded fourth between roughly 560 and 1010px. The
   explicit middle step keeps it 4 / 2 / 1. auto-fit above and minmax(0,1fr)
   below both stay count-agnostic, so a band of two or three stats still lays
   out sensibly — auto-fit drops the tracks it does not need. */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:var(--s-6) var(--s-6)}
@media(max-width:1010px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.pfact{display:flex;flex-direction:column;color:#fff;padding-right:10px}
.pstat{font-size:var(--t-stat);font-weight:var(--w-light);line-height:1.05;letter-spacing:-.015em;transition:color .12s}
.plabel{font-size:var(--t-meta);line-height:1.4;color:#dfe6ee;margin-top:6px}
/* margin-top:auto so the source lines sit on one baseline across the row — the
   labels wrap to one or two lines, which otherwise staggers them. */
.psrc{font-size:var(--t-label);letter-spacing:.06em;text-transform:uppercase;color:#a9bace;margin-top:auto;padding-top:8px;transition:color .12s}
/* The go-arrow rides on the source name rather than sitting in the corner of
   the cell: in the corner it reads as part of the stat, which already contains
   an arrow ("79% → 97% →"). It stays visible rather than appearing on hover,
   since a phone has no hover and would otherwise see no affordance at all. */
.pgo{margin-left:5px;transition:transform .12s;display:inline-block}
a.pfact:hover .pstat{color:var(--accent)}
a.pfact:hover .psrc{color:#fff}
a.pfact:hover .pgo{transform:translateX(2px)}
@media(max-width:560px){.proof{padding:22px 18px 24px;border-radius:var(--r-card)}.pgrid{gap:var(--s-4)}}
.btn{display:inline-flex;align-items:center;gap:var(--s-2);background:var(--orange);color:var(--navy);border:0;border-radius:var(--r-ctl);padding:12px 22px;font-size:var(--t-meta);font-weight:var(--w-semi)}
.btn:hover{background:var(--orange-d)}
.btn.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
.btn.ghost:hover{background:#fbf2ea}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--s-4);margin-top:22px}
.tcard{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:var(--s-2)}
/* Every card that is a link answers the same way: the border goes navy and the
   card rises 2px on a soft navy shadow. There were four variants of this. */
.tcard:hover,.mcard:hover,.pcard:hover,.pg:hover{border-color:var(--navy);transform:translateY(-2px);box-shadow:0 6px 18px rgba(33,52,76,.08)}
.tcard .ic{color:var(--navy)}
.tcard h3{font-size:var(--t-heading);margin:4px 0 0;color:var(--navy)}
.tcard .sub{font-size:var(--t-meta);color:var(--muted)}
.tcard .sub b{color:var(--navy);font-weight:var(--w-semi)}
.tcard .tdesc{font-size:var(--t-meta);line-height:1.5;color:var(--muted);margin:6px 0 2px}
.tcard .go{margin-top:auto;font-size:var(--t-meta);color:var(--navy);font-weight:var(--w-semi)}
.tcard .go .arr,.pcard .plink .arr{display:inline-block;transition:transform .15s ease}
.tcard:hover .go .arr,.pcard:hover .plink .arr{transform:translateX(3px)}

/* "Start here" — three numbered entry points under the toolkit cards. Flat and
   white like the cards above; the number carries the sequence (watch it, read
   it, then take the templates). Each card ends in the resource's OWN action
   button, so this is a row you act on rather than another list of links, and
   margin-top:auto holds those buttons on one baseline when the notes wrap to
   different depths. */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:var(--s-4)}
@media(max-width:860px){.sgrid{grid-template-columns:minmax(0,1fr)}}
.scard{display:flex;gap:var(--s-3);background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 19px}
.snum{flex:none;width:27px;height:27px;border-radius:50%;background:var(--navy);color:#fff;font-size:var(--t-meta);font-weight:var(--w-semi);display:flex;align-items:center;justify-content:center}
.sbody{display:flex;flex-direction:column;min-width:0;flex:1}
.stop{display:flex;align-items:flex-start;gap:var(--s-2)}
.stop .ic{color:var(--navy);flex:none;margin-top:2px}
.stitle{font-size:var(--t-body);font-weight:var(--w-semi);color:var(--navy);line-height:1.3}
.snote{font-size:var(--t-meta);color:#46545f;line-height:1.5;margin-top:7px}
/* Action and location stack rather than sitting side by side. On one row the
   longer module names ("in Enabling Conditions →") wrap under the button on
   some cards and not others, so the cards stop matching each other. Stacking
   costs a line and makes every card the same shape. */
.sact{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s-2);margin-top:auto;padding-top:14px}
.swhere{font-size:var(--t-label);color:var(--muted)}
.swhere:hover{color:var(--navy)}
/* Blue was 0% of the page. The spec gives it "divider pages, links, large
   display type", and a full-bleed band is the web form of a divider page —
   the one place blue may carry white text. "On blue: large white type only",
   hence display size here rather than body size. Kept off .band, which a
   module's empty state shares and which is a small light-blue panel. */
.closer{background:var(--blue);color:#fff;padding:var(--s-12) 0;margin-top:var(--s-8)}
/* Deliberately larger than --t-display. White on blue is 3.51:1 — it clears
   the 3:1 AA bar for large text, but the brand pairs that ratio with 60pt+
   on its own divider pages, and Light weight thins the strokes further. This
   lands between 32 and 56px so it is unambiguously display type. */
.closer p{font-size:clamp(32px,4.6vw,56px);font-weight:var(--w-light);line-height:1.1;letter-spacing:-.02em;margin:0;max-width:20ch}
.band{background:var(--accent);border-radius:var(--r-card);padding:18px 22px;margin-top:22px;color:var(--navy);font-size:var(--t-meta);display:flex;align-items:center;gap:var(--s-3)}
.section-h{margin:34px 0 0}
.section-h h1{font-size:var(--t-display);color:var(--navy);margin:0}
.section-h p{font-size:var(--t-body);color:#41505f;max-width:var(--measure);margin:10px 0 0}
.vidbar{display:flex;align-items:center;gap:var(--s-3);background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:12px 15px;color:var(--muted);font-size:var(--t-meta);max-width:340px;margin-top:16px}
.vidbar .ic{color:var(--navy)}

/* Orange was 0.6% of the page. Its role in the spec is "fill, rule, eyebrow",
   never text — so it arrives here as a rule above every section label, which
   repeats across the site and never has to carry meaning. */
.lab{font-size:var(--t-label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:var(--w-semi);margin:30px 0 12px}
.lab::before{content:"";display:block;width:28px;height:3px;background:var(--orange);margin-bottom:var(--s-2)}
/* minmax(0,1fr), not a bare 1fr: a bare 1fr track is minmax(auto,1fr), and that
   auto floor is the item's min-content, which the module card's resource peek
   rows pushed to 411px. On a 390px phone the toolkit page scrolled sideways by
   37px as a result. Confirmed by toggling this one value in the live page. */
.mcards{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s-3)}
.mcard{display:flex;flex-direction:column;gap:0;background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:13px 15px}
.mcard .mhead{display:flex;align-items:center;gap:var(--s-3)}
.mpeeks{display:flex;flex-direction:column;margin:11px 0 1px 42px;border-top:1px solid var(--line);padding-top:4px}
.mpeek{display:flex;align-items:center;gap:var(--s-2);padding:6px 0;font-size:var(--t-meta);min-width:0}
.mpeek .ic{color:var(--gray);flex:none}
.mpt{flex:1;min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard:hover .mpt{color:var(--ink)}
.mmore{font-size:var(--t-label);color:var(--navy);font-weight:var(--w-semi);padding:7px 0 1px}
@media(max-width:560px){
  .mpeeks{margin-left:0}
  .mpeek .chip.fmt{display:none}
}
.mcard .mnum{flex:none;width:29px;height:29px;border-radius:50%;background:var(--slate);color:var(--navy);font-weight:var(--w-semi);font-size:var(--t-meta);display:flex;align-items:center;justify-content:center}
.mcard.empty .mnum{color:var(--muted)}
.mcard .mbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.mcard .mt{font-size:var(--t-body);font-weight:var(--w-semi);color:var(--navy);line-height:1.25}
.mcard .mstat{font-size:var(--t-label);color:var(--muted)}
.mcard .mstat.ok{color:var(--ok-tx);font-weight:var(--w-semi)}
.mcard .marrow{flex:none;color:var(--muted);font-size:var(--t-body);transition:transform .12s,color .12s}
.mcard:hover .marrow{color:var(--navy);transform:translateX(2px)}
.mcard.empty{background:#fbfcfc}
.mcard.empty .mstat{color:#8b939c}
/* Section (toolkit) hero */
.sechero{position:relative;overflow:hidden;min-height:290px;display:flex;align-items:flex-end;margin-bottom:16px;background:var(--navy)}
.sechero .shimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 28%;display:block}
.sechero::after{content:"";position:absolute;inset:0;background:rgba(33,51,76,.58)}
.sechero-in{position:relative;z-index:1;width:100%;padding-top:var(--s-8);padding-bottom:var(--s-8)}
.sechero-in>*{max-width:760px}
.sechero-in h1{color:#fff;font-size:var(--t-display);margin:0}
.sechero.tall{min-height:340px;margin-bottom:0}
.sechero.tall .shimg{object-position:center 30%}
.sechero.tall::after{background:rgba(33,51,76,.62)}
.sechero-sub{font-size:var(--t-body);color:#41505f;max-width:var(--measure);margin:0;line-height:1.62}
.lab .labnote{text-transform:none;letter-spacing:normal;font-weight:var(--w-body);color:var(--muted);margin-left:9px;font-size:var(--t-label)}
/* R2I Practices landing */
.r2ihero{max-width:780px;margin:0 0 6px}
.r2ihero h1{font-size:var(--t-display);color:var(--navy);margin:6px 0 0}
.r2ihero p{font-size:var(--t-body);color:#41505f;margin:14px 0 0;line-height:1.65}
.eyebrow.light{color:#dfe6ee}
/* Two paragraphs, two columns. As one block they ran the full 996px column —
   about 130 characters a line — because #app>*'s max-width outranks the one
   that used to be set here. */
.r2iintro{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s-3) var(--s-12);margin-top:var(--s-6)}
@media(min-width:860px){.r2iintro{grid-template-columns:repeat(2,minmax(0,1fr))}.r2iintro>p:only-child{max-width:var(--measure)}}
.r2iintro p{font-size:var(--t-body);color:#41505f;margin:0;line-height:1.62}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--s-4)}
.pcard{display:flex;flex-direction:column;background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
/* contain on white: these are drawings on a white ground, and cover was
   cutting heads and feet off at the card edge. */
.pcard .pimg{display:block;width:100%;aspect-ratio:16/9;background-size:contain;background-repeat:no-repeat;background-position:center;background-color:#fff;border-bottom:1px solid var(--line)}
/* Five cards in three columns left a hole at the end of the second row. On a
   six-track grid each card spans two, and when there are exactly five the last
   two span three, so both rows run the full width. Any other count is
   untouched: the selectors only match a 4th-of-5 and a 5th-of-5. */
@media(min-width:960px){
  .pcards{grid-template-columns:repeat(6,minmax(0,1fr))}
  .pcards>.pcard{grid-column:span 2}
  .pcards>.pcard:nth-child(4):nth-last-child(2),.pcards>.pcard:nth-child(5):nth-last-child(1){grid-column:span 3}
  .pcards>.pcard:nth-child(4):nth-last-child(2) .pimg,.pcards>.pcard:nth-child(5):nth-last-child(1) .pimg{aspect-ratio:24/9}
}
.pcard .pcard-b{padding:14px 17px 16px;display:flex;flex-direction:column;gap:var(--s-2)}
.pcard .prow{display:flex;align-items:center;gap:var(--s-3)}
.pcard .pnum{flex:none;width:26px;height:26px;border-radius:50%;background:var(--orange);color:var(--navy);font-weight:var(--w-semi);font-size:var(--t-label);display:flex;align-items:center;justify-content:center}
.pcard .pt{font-size:var(--t-body);font-weight:var(--w-semi);color:var(--navy)}
.pcard .pd{font-size:var(--t-meta);color:#46545f;line-height:1.5}
.pcard .plink{font-size:var(--t-label);font-weight:var(--w-semi);color:var(--navy);margin-top:1px}
/* min(330px,100%) for the same reason as .focalgrid: a bare 330px floor cannot
   shrink below itself. At 360px the track was 330px in a 328px container —
   over, but not enough to scroll the page. At 320px it did: the page scrolled
   to 347px. Measured both ways by toggling this value in the running page. */
.tqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:var(--s-3)}
.tq{background:var(--white);border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:var(--r-card);padding:18px 20px;margin:0}
.tq blockquote{margin:0;font-weight:var(--w-light);font-size:var(--t-heading);line-height:1.26;letter-spacing:-.01em;color:var(--navy)}
.tq figcaption{margin-top:14px;display:flex;align-items:center;gap:var(--s-3)}
.tq .tqa{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:var(--slate)}
.tq .tqmeta{display:flex;flex-direction:column;gap:1px;min-width:0}
.tq .tqn{font-size:var(--t-meta);font-weight:var(--w-semi);color:var(--ink)}
.tq .tqr{font-size:var(--t-label);color:var(--muted)}
.r2imap{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;text-align:center}
.r2imap p{font-size:var(--t-meta);color:#46545f;margin:0 0 12px;max-width:60ch;margin-left:auto;margin-right:auto}
.r2imap img{max-width:100%;height:auto}
.plogos{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-4) var(--s-8);padding:6px 2px}
.plogo{display:flex;align-items:center;justify-content:center;height:44px}
/* multiply: several of these files have a white ground rather than a
   transparent one, and each sat in its own white box on the tinted page. */
.plogo img{max-height:44px;max-width:148px;width:auto;object-fit:contain;filter:grayscale(1);opacity:.7;mix-blend-mode:multiply;transition:filter .15s,opacity .15s}
.plogo:hover img{filter:none;opacity:1}
.jrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:var(--s-3)}
.jstep{display:flex;gap:var(--s-3);background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:16px 18px}
.jstep .jnum{flex:none;width:30px;height:30px;border-radius:50%;background:var(--slate);color:var(--navy);font-weight:var(--w-semi);font-size:var(--t-meta);display:flex;align-items:center;justify-content:center}
.jstep .jbody{display:flex;flex-direction:column;gap:var(--s-2)}
.jstep .jlabel{font-size:var(--t-meta);font-weight:var(--w-semi);color:var(--navy)}
.jstep .jtext{font-size:var(--t-meta);color:#46545f;line-height:1.5}

/* Featured cards pair up when they are the short, plain kind — a module like
   Co-Planning / Detailed Practice in Action had four identical 155px cards in a
   single 996px column, which reads as a list, not as "featured". A rich card
   (photo + narrative) or a full-collection card always keeps the full width:
   those run 200-500px tall and would be crushed at half width. No module today
   mixes the two kinds, so this leaves no gaps; the span rule is there so it
   still behaves if one ever does. 420px floor => 2 columns at the 996px max
   and a single column below roughly 880px of viewport.
   min(420px,100%) rather than a bare 420px: a plain minmax floor cannot shrink
   below itself, so on a 375px phone the track stayed 420px wide and pushed the
   whole page into horizontal scroll. */
.focalgrid{display:grid;gap:var(--s-3);margin-bottom:10px;grid-template-columns:repeat(auto-fill,minmax(min(420px,100%),1fr))}
.focalgrid>.rcard.rich,.focalgrid>.rcard.collhero{grid-column:1/-1}
/* Side-by-side cards stretch to the tallest in their row, so without this the
   action sits straight under the summary and the two buttons land at different
   heights. Pushing .acts to the bottom lines them up. Scoped away from .rich
   (a two-column photo/text grid) and .collhero (already a flex column). */
.focalgrid>.rcard:not(.rich):not(.collhero){display:flex;flex-direction:column}
.focalgrid>.rcard:not(.rich):not(.collhero) .acts{margin-top:auto;padding-top:13px}
.rcard{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:17px 19px}
.rcard.soon{background:#f6f7f8}
.rcard .top{display:flex;align-items:flex-start;gap:var(--s-3)}
.rcard .ic{color:var(--navy);flex:none;margin-top:1px}
.rcard.soon .ic{color:var(--gray)}
.rcard .ttl{font-size:var(--t-body);font-weight:var(--w-semi);color:var(--navy);flex:1}
.rcard.soon .ttl{color:#7d8893}
.rcard .desc{font-size:var(--t-meta);color:#46545f;margin:9px 0 0;max-width:var(--measure)}
.rcard .who{font-size:var(--t-label);color:var(--muted);margin:7px 0 0;font-style:italic}
.rcard .acts{display:flex;align-items:center;gap:var(--s-2);margin-top:13px;flex-wrap:wrap}
/* Rich practice content carried over from the CoLab collection pages */
.rcard .body{font-size:var(--t-body);color:#46545f;margin:10px 0 0;line-height:1.6;max-width:var(--measure)}
.rcard .body p{margin:0 0 9px}.rcard .body p:last-child{margin-bottom:0}
.rcard .why{margin:14px 0 0}
.rcard .whyh{font-size:var(--t-label);letter-spacing:.08em;text-transform:uppercase;color:var(--navy);font-weight:var(--w-semi);margin-bottom:6px}
.rcard .why ul{margin:0;padding-left:18px;max-width:var(--measure)}
.rcard .why li{font-size:var(--t-meta);color:#46545f;margin:0 0 5px;line-height:1.5}
.rcard .pq{margin:14px 0 0;padding:4px 0 4px 15px;border-left:3px solid var(--orange);font-family:inherit;font-weight:var(--w-light);color:var(--navy);font-size:var(--t-body);line-height:1.3;max-width:var(--measure)}
/* Practice card: photo (true 3:2, uncropped) on the left, content on the right */
.rcard.rich{display:grid;grid-template-columns:248px 1fr;gap:var(--s-6);align-items:start}
.rcard.rich .media{margin:0;align-self:start}
.rcard.rich .rimg{width:100%;height:auto;display:block;object-fit:cover;margin:0;background:var(--sunken)}
.rcard.rich .cap{font-size:var(--t-label);color:var(--muted);font-style:italic;text-align:center;margin:8px 2px 0;line-height:1.35}
.rcard.rich .top{margin-top:1px}
@media(max-width:680px){.rcard.rich{grid-template-columns:1fr;gap:var(--s-3)}}
/* Full-collection card: a clean, accented download CTA */
.rcard.collhero{border:2px solid var(--orange);background:#fdf4ed;display:flex;flex-direction:column;align-items:flex-start}
.rcard.collhero .eyebrow{display:inline-block;font-size:var(--t-label);letter-spacing:.11em;text-transform:uppercase;font-weight:var(--w-semi);color:var(--orange);margin-bottom:5px}
.rcard.collhero .ttl{font-size:var(--t-sub);color:var(--navy);line-height:1.12;margin:0}
.rcard.collhero .desc{margin-top:9px}
.rcard.collhero .acts{margin-top:16px}
.dl{display:inline-flex;align-items:center;gap:var(--s-2);background:var(--navy);color:#fff;border:0;border-radius:var(--r-ctl);padding:8px 15px;font-size:var(--t-meta);font-weight:var(--w-semi)}
.dl:hover{background:#2d4466}
/* The icon inside a button takes the button's text colour. .rcard .ic and
   .morerow .ic set navy/grey for the card's own format icon and were also
   catching this one, so every Watch / Open / Download on a resource card had a
   navy icon on a navy button — an unexplained gap before the word. */
.dl .ic,.rcard .dl .ic,.morerow .dl .ic,.scard .dl .ic{color:currentColor;margin-top:0}

.chip{display:inline-flex;align-items:center;gap:var(--s-2);font-size:var(--t-label);font-weight:var(--w-semi);padding:2px 9px;border-radius:var(--r-pill)}
/* .chip.ok ("Available") was retired from resource cards: a card that is on the
   page and carries a Download button is self-evidently available, and the badge
   repeated on every one of them. --ok-bg/--ok-tx stay — .mcard .mstat.ok uses
   them for the resource counts on a section page. */
.chip.soon{background:var(--soon-bg);color:var(--soon-tx)}
.chip.new{background:var(--accent);color:var(--navy)}
.chip.fmt{background:#eef1f2;color:#55616c}

.morelist{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.morerow{display:flex;align-items:center;gap:var(--s-3);padding:10px 14px;border-bottom:1px solid var(--line);font-size:var(--t-meta);transition:background .12s}
.morerow:last-child{border-bottom:0}
.morerow.have:hover{background:#e9f3f5}
.morerow .ic{color:var(--muted);flex:none}
.morerow .rt{flex:1;color:var(--ink)}
.morerow.soon .rt{color:#5f6770}
/* One filled action per card; the rows under "More resources and tools" are
   secondary by definition, so theirs is a ghost button that fills in on hover.
   Before this, an eleven-resource module showed eleven identical navy pills and
   nothing led. Navy on white is well past AA, and the row's own hover keeps the
   target obvious. */
.morerow .dl{padding:5px 12px;font-size:var(--t-label);background:transparent;color:var(--navy);border:1px solid var(--line);font-weight:var(--w-semi)}
.morerow .dl:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.morerow.have:hover .dl{border-color:#9fb3c4}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.ok{background:#2f9e63}.dot.soon{background:#c4ccd2}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3);margin-top:var(--s-8);border-top:1px solid var(--line);padding-top:var(--s-4)}
.pg{display:flex;flex-direction:column;gap:2px;background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s-3) var(--s-4);min-width:0}
.pg-l{font-size:var(--t-label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:var(--w-semi)}
.pg-t{font-size:var(--t-body);color:var(--navy);font-weight:var(--w-semi);line-height:1.3}
.pg-next{text-align:right;align-items:flex-end}
/* Holds the grid column so a first module's Next still sits on the right. */
.pg-empty{background:none;border:0;padding:0;min-height:0}
@media(max-width:560px){.pager{grid-template-columns:1fr}.pg-next{text-align:left;align-items:flex-start}.pg-empty{display:none}}
/* A module's photo or intro video. The slot takes the column width from
   #app>*; the media inside keeps its own 560px and sits flush left with the
   copy above it. Before the slot existed these were direct children of #app,
   where that rule's max-width won on specificity (id+child beats one class)
   and stretched them to the full 996px column. Hard edges, no frame — brand
   spec section 5. */
.mediaslot{margin-top:var(--s-4)}
.modimg{display:block;width:100%;max-width:560px;aspect-ratio:16/9;object-fit:cover;background:var(--sunken)}
/* A page's intro and its photo or video sit side by side. Stacked, the media
   was a 560px box under the text with the other 436px of the column empty,
   which read as something missing. .pagehead is the direct child of #app, so
   the measure on the text inside it is no longer overridden by #app>*'s own
   max-width (which is how the section intro came to run 130 characters wide). */
.pagehead{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s-6);align-items:center;margin-top:var(--s-6)}
.pagehead .section-h{margin:0}
.pagehead .mediaslot{margin:0}
.pagehead .modimg,.pagehead .vplay{max-width:640px}
@media(min-width:900px){
  .pagehead.has-media{grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:var(--s-12)}
  .pagehead.has-media .modimg,.pagehead.has-media .vplay{max-width:none}
}
/* The collection illustrations are drawn on white. Shown as photos they were a
   white rectangle on the tinted page, cropped at the feet. Multiply lets the
   page colour through the white, and contain shows the whole drawing. */
.modimg.illus{object-fit:contain;background:none;mix-blend-mode:multiply}
.attrib{font-size:var(--t-label);color:var(--muted);font-style:italic;margin-top:20px}

/* The title matches every other page (it was 28px against their 44). The
   section headings were orange text, which the brand does not allow — orange
   is a fill and a rule, never a heading — so they take the site's own section
   label: navy-grey capitals under a short orange rule. */
.about{margin-top:var(--s-6)}
.about h1{font-size:var(--t-display);color:var(--navy);margin:0 0 var(--s-2)}
.about h2{font-size:var(--t-label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:var(--w-semi);margin:var(--s-8) 0 var(--s-2)}
.about h2::before{content:"";display:block;width:28px;height:3px;background:var(--orange);margin-bottom:var(--s-2)}
.about p{font-size:var(--t-body);color:#41505f;max-width:var(--measure);margin:0 0 var(--s-3);line-height:1.62}

footer.site{background:var(--navy);color:#c6d0db;font-size:var(--t-label);padding:22px;margin-top:30px}
footer.site .row{max-width:996px;margin:0 auto;display:flex;flex-wrap:wrap;gap:var(--s-3);align-items:center}
footer.site .lic{flex-basis:100%;color:#9fb0c0;font-size:var(--t-label);margin-top:8px}
footer .footlogo{flex-basis:100%;margin-bottom:10px}
footer .footlogo img{height:24px;width:auto;display:block}
footer .signup{margin-left:auto;display:flex;gap:var(--s-2);align-items:center}
footer .signup input{border:0;border-radius:var(--r-ctl);padding:8px 11px;font-size:var(--t-label);font-family:inherit}
footer .signup button{background:var(--orange);color:var(--navy);border:0;border-radius:var(--r-ctl);padding:8px 14px;font-size:var(--t-label);font-weight:var(--w-semi)}
footer .signup button:hover{background:var(--orange-d)}

/* demo panel */
#demoToggle{position:fixed;right:20px;bottom:20px;z-index:40;background:var(--ink);color:#fff;border:0;border-radius:var(--r-pill);padding:13px 20px;font-size:var(--t-meta);font-weight:var(--w-semi);box-shadow:0 6px 20px rgba(0,0,0,.22);display:flex;align-items:center;gap:var(--s-2)}
#demoToggle:hover{background:#0c1726}
#panel{position:fixed;left:0;right:0;bottom:0;z-index:39;background:#fff;border-top:3px solid var(--coral);box-shadow:0 -10px 30px rgba(0,0,0,.18);max-height:64vh;transform:translateY(105%);transition:transform .26s ease}
#panel.open{transform:translateY(0)}
.panhd{display:flex;align-items:center;gap:var(--s-3);padding:14px 20px;border-bottom:1px solid var(--line);background:var(--slate)}
.panhd .pt{font-weight:var(--w-semi);font-size:var(--t-meta);color:var(--navy)}
.panhd .pd{font-size:var(--t-label);color:var(--muted)}
.panhd .x{margin-left:auto;background:none;border:0;color:var(--muted);font-size:var(--t-heading);line-height:1}
.panbody{padding:14px 20px;overflow:auto;max-height:calc(64vh - 56px)}
.erow{display:grid;grid-template-columns:64px 64px 1fr;gap:var(--s-3);align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow .sw{display:flex;flex-direction:column;align-items:center;gap:var(--s-1);font-size:var(--t-label);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.switch{position:relative;width:40px;height:22px;flex:none}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#cdd3d8;border-radius:var(--r-pill);transition:.16s}
.slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.16s}
.switch input:checked+.slider{background:var(--coral)}
.switch input:checked+.slider:before{transform:translateX(18px)}
.efields{display:flex;flex-direction:column;gap:var(--s-2)}
.efields input,.efields textarea{font-family:inherit;font-size:var(--t-meta);border:1px solid var(--line);border-radius:var(--r-ctl);padding:7px 9px;width:100%;color:var(--ink);resize:vertical}
.efields .cap{font-size:var(--t-label);color:var(--muted)}
.panhint{padding:26px 20px;color:var(--muted);font-size:var(--t-meta);text-align:center}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r-ctl);font-size:var(--t-meta);opacity:0;transition:.2s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* library dropdown */
nav.main .dd{position:relative}
nav.main .dd>a{display:inline-flex;align-items:center;gap:var(--s-2)}
nav.main .dd .caret{font-size:var(--t-label);opacity:.8}
nav.main .dd .ddmenu{position:absolute;top:calc(100% + 10px);left:0;min-width:250px;background:#fff;border:1px solid var(--line);border-radius:var(--r-card);box-shadow:0 12px 34px rgba(0,0,0,.16);padding:8px;display:none;z-index:30}
nav.main .dd.open .ddmenu{display:block}
.ddmenu .ddhead{font-size:var(--t-label);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 10px 8px}
/* Scoped above nav.main a (the navy-header link color) so menu text stays dark on white */
nav.main .dd .ddmenu a{display:flex;align-items:center;justify-content:space-between;color:var(--ink);font-size:var(--t-meta);padding:8px 10px;border-radius:var(--r-ctl);font-weight:var(--w-semi)}
nav.main .dd .ddmenu a:hover{background:var(--accent);color:var(--navy)}
/* While a menu has just opened under the cursor, hold the hover highlight until the mouse moves */
body.ddNoHover nav.main .dd .ddmenu a:hover{background:transparent;color:var(--ink)}
.ddmenu .ddsoon{font-size:var(--t-label);letter-spacing:.04em;text-transform:uppercase;color:var(--soon-tx);background:var(--soon-bg);padding:2px 7px;border-radius:var(--r-pill)}
/* ask the resources */
#askBtn{display:inline-flex;align-items:center;gap:var(--s-2);background:var(--orange);color:var(--navy);border:0;border-radius:var(--r-pill);padding:8px 15px;font-size:var(--t-meta);font-weight:var(--w-semi);flex:0 0 auto;cursor:pointer}
#askBtn:hover{background:var(--orange-d)}
#askBtn .sp{font-size:var(--t-meta)}
#askWrap{position:fixed;inset:0;z-index:45;display:none}
#askWrap.open{display:block}
#askWrap .ovl{position:absolute;inset:0;background:rgba(21,35,53,.34)}
#askPanel{position:absolute;top:0;right:0;height:100%;width:380px;max-width:92vw;background:var(--white);box-shadow:-12px 0 40px rgba(0,0,0,.22);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .28s ease}
#askWrap.open #askPanel{transform:translateX(0)}
.askhd{background:var(--navy);color:#fff;padding:16px 18px}
.askhd .t{font-size:var(--t-body);font-weight:var(--w-semi);display:flex;align-items:center;gap:var(--s-2)}
.askhd .x{position:absolute;top:14px;right:14px;background:none;border:0;color:#cdd8e4;font-size:var(--t-sub);line-height:1;cursor:pointer}
.askbody{flex:1;overflow:auto;padding:18px}

     gutter no longer lines up with main's 16px. Reclaiming both buys 38px and
     aligns the logo with the content below it. That is what a 360px phone was
     short by: the logo, search and Menu button needed 397px of a 360px bar. */

  header.site{padding:8px max(16px,calc((100% - 996px)/2));gap:var(--s-3)}

<style>
.gate{position:fixed;inset:0;background:rgba(20,28,38,.55);display:none;align-items:center;justify-content:center;z-index:120;padding:20px}

.sechead{display:block;width:100%;max-height:240px;object-fit:cover;margin:6px 0 4px;background:var(--sunken)}
.skiplink{position:absolute;left:-9999px;top:0;background:#21344C;color:#fff;padding:10px 14px;border-radius:0 0 var(--r-ctl) 0;z-index:200;text-decoration:none}

.vmodal{position:fixed;inset:0;background:rgba(10,16,24,.8);display:none;align-items:center;justify-content:center;z-index:140;padding:20px}

<script>
const DATA = __DATA__;
let state = JSON.parse(JSON.stringify(DATA.resources));
let view = {type:'home'};

const ICONS={
 Document:'M7 3h8l4 4v14H7z M15 3v5h5',
 Deck:'M4 4h16v11H4z M12 15v4 M9 21h6',
 Tool:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M12 3v2 M12 19v2 M3 12h2 M19 12h2',
 Protocol:'M6 4h9l3 3v13H6z M9 12l2 2 4-4',
 Template:'M4 4h16v16H4z M4 9h16 M9 9v11',
 'Case Study':'M6 4h9a3 3 0 0 1 3 3v13H9a3 3 0 0 1-3-3z M9 4v13',
 Infographic:'M5 20V11 M10 20V4 M15 20v-7 M20 20V8',
 Video:'M6 4v16l13-8z',
 Open:'M19 13v6a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6 M15 4h5v5 M20 4l-9 9',
 Other:'M12 6a6 6 0 1 0 0 12 6 6 0 0 0 0-12z'
};
function icon(f,size){const p=ICONS[f]||ICONS.Other;size=size||20;return `<svg class="ic" aria-hidden="true" focusable="false" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p.split(' M').map((seg,i)=>`<path d="${i?'M'+seg:seg}"/>`).join('')}</svg>`}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escAttr(s){return esc(s).replace(/"/g,'&quot;')}
function modsOf(sec){return DATA.sections.find(s=>s.name===sec).modules}
// The opening sentence of a sheet intro, for card-sized summaries. Falls back to a
// clean word break when the first sentence is longer than the space allows.
function firstSentence(text,max){
 const t=String(text||'').trim(); if(!t)return '';
 const stop=t.search(/[.!?](\s|$)/);
 let out=stop>-1?t.slice(0,stop+1):t;
 if(out.length>max){out=out.slice(0,max).replace(/\s+\S*$/,'')+'…';}
 return out;
}
function resOf(sec,mod){return state.filter(r=>r.section===sec && r.module===mod)}
function availCount(sec,mod){return resOf(sec,mod).filter(r=>r.published).length}

// A section's modules: the ones declared on the Modules tab, plus any module a
// published resource actually claims.
//
// The two lists drift. A resource's `module` is a dropdown fed by the Lists tab,
// so editors can only pick a valid value; the Modules tab is typed by hand and has
// no such guard. When it falls behind, every resource pointing at the newer name
// belongs to a module the page does not know about and renders nowhere — silently.
// Eight published resources are in that state today.
//
// Rather than drop them, treat any module a published resource names as real. The
// page is then self-healing: the resource shows up the moment it is published, and
// fixing the Modules tab only changes the order and adds the intro text.
function modulesOf(sec){
 const declared=(DATA.sections.find(x=>x.name===sec)||{}).modules||[];
 const known=new Set(declared.map(m=>m.name));
 const extra=[];
 state.forEach(r=>{
  if(r.section!==sec||!r.published||!r.module)return;
  if(known.has(r.module))return;
  known.add(r.module); extra.push({name:r.module,intro:'',video:'',undeclared:true});
 });
 return declared.concat(extra);
}

function navHtml(){
 const link=name=>`<a href="#" data-go="section:${name}" class="${view.section===name?'active':''}">${esc(name)}</a>`;
 const div='<span class="nav-div" aria-hidden="true"></span>';
 const nav=DATA.nav||{groups:[],secondary:null,collections:null,about:null};
 const parts=(nav.groups||[]).map(g=>(g.sections||[]).map(link).join('')).filter(Boolean);
 // Evidence & Stories — the live secondary sections (Stories & Spotlights, Evidence & Impact)
 const sec=nav.secondary;
 if(sec && (sec.sections||[]).length){
  const secs=sec.sections||[];
  const seclink=s=>`<a href="#" data-go="section:${esc(s.name)}" class="${view.section===s.name?'active':''}">${esc(s.name)}</a>`;
  // With one section left, a dropdown labelled "Evidence & Stories" promises more
  // than the menu holds — so link straight to the section under its own name. The
  // dropdown returns by itself when the sheet makes another secondary section live,
  // which is why this is read off the data rather than fixed in SECONDARY_NAV_LABEL.
  if(secs.length===1){
   parts.push(seclink(secs[0]));
  }else{
   parts.push(`<div class="dd" id="secDD"><a href="#" data-dd="sec">${esc(sec.name)} <span class="caret">&#9662;</span></a><div class="ddmenu">${secs.map(seclink).join('')}</div></div>`);
  }
 }
 // Research-to-Impact Collections — cross-cutting topics; "soon" chips until the section goes live
 const col=nav.collections;
 if(col && (col.items||[]).length){
  const overview=(col.visible&&DATA.r2iHome)?`<a href="#" data-go="r2ihome">Overview</a><div class="dddiv"></div>`:'';
  const items=overview+(col.items||[]).map(c=>col.visible
    ? `<a href="#" data-go="module:${esc(col.section||col.name)}|${esc(c)}">${esc(c)}</a>`

/* ---- search ----------------------------------------------------------------
   Ranked retrieval (BM25F) over the published library, built once at load and
   run entirely in the browser. It costs nothing, answers instantly, is offline
   after first load, and cannot invent a resource that does not exist.

   What it replaced: a strict-AND keyword filter, which meant every word of a
   query had to appear in one resource. That is fine for "repeated reading" and
   useless for "how do I start co-planning with a new co-teacher?" — which
   needed a resource containing "how" AND "do" AND "i". Measured against 32 real
   practitioner queries, 18 returned nothing; 17 of the 18 were questions, and
   every keyword query already worked. The box says "Search or ask a question",
   so the questions are not an edge case.
   tools/search-eval.mjs holds that measurement and runs in CI. ------------- */

/* Function words and question scaffolding. */
const SEARCH_STOP=new Set(('a an the this that these those there here of to for on in at with within without and or but if as by from into about over under across '+
'how do does did done doing i we you he she they it its im ive id what which who whom whose when where why whether '+
'is are am was were be been being can could should would will shall may might must have has had not no nor '+
'any some more most much many very just also too so than then our your their my me us them her his '+
'please thing things stuff want wants need needs looking look around other same anything something getting '+
'know help kids way ways good best better great really actually usually often sure able lot').split(/\s+/));

/* What a practitioner types -> what this library calls it. The highest-leverage
   piece of the search, and deliberately a hand-built domain table rather than
   anything statistical: the gap is almost never spelling, it is that a teacher
   says "co-teacher" and the sheet says "co-planning", or says "below grade
   level" and the sheet says "fluency". Longest keys match first, so a phrase
   beats its parts. Synonyms ADD to a query and never replace it, so a word the
   visitor actually typed always outranks one we inferred. */
const SEARCH_SYN={
 'co teacher':'co planning collaboration','coteacher':'co planning collaboration',
 'co teaching':'co planning collaboration','coteaching':'co planning collaboration',
 'team teaching':'co planning collaboration','inclusion':'co planning collaboration',
 'general education':'co planning collaboration','gen ed':'co planning collaboration',
 'planning time':'enabling conditions planning time','common planning':'enabling conditions planning time',
 'master schedule':'enabling conditions schedule','schedule':'enabling conditions schedule',
 'scheduling':'enabling conditions schedule','stalls':'common pitfalls barriers',
 'getting started':'getting started','get started':'getting started','new to':'getting started overview',
 'first meeting':'kickoff agenda getting started','kickoff':'kickoff agenda',
 'roll out':'leading implementation launch','rolling out':'leading implementation launch',
 'launch':'leading implementation launch getting started',
 'below grade level':'repeated reading fluency','behind in reading':'repeated reading fluency',
 'struggling reader':'repeated reading fluency','struggling readers':'repeated reading fluency',
 'low readers':'repeated reading fluency','reluctant readers':'repeated reading fluency',
 'fluently':'fluency','fluent':'fluency','fluancy':'fluency','decoding':'fluency reading',
 'oral reading':'fluency repeated reading','reading intervention':'repeated reading fluency intervention',
 'high schoolers':'secondary','high school':'secondary','middle school':'secondary',
 'iep':'disabilities special education','ieps':'disabilities special education',
 'special education':'disabilities special education','sped':'disabilities special education',
 'students with disabilities':'disabilities','swd':'disabilities','disability':'disabilities',
 'accommodations':'disabilities differentiated','differentiation':'differentiated instruction',
 'small group':'differentiated instruction group','small groups':'differentiated instruction group',
 'mtss':'mtss multi tiered intervention data','rti':'mtss intervention data',
 'multi tiered':'mtss multi tiered intervention','intervention':'intervention mtss data',
 'interventions':'intervention mtss data','data meeting':'routine data cycles',
 'data meetings':'routine data cycles','data day':'routine data cycles',
 'data dive':'routine data cycles','data cycle':'routine data cycles',
 'assessment':'assessment data','assessments':'assessment data',
 'college':'postsecondary college career','career':'postsecondary college career',
 'graduation':'postsecondary graduation','graduation rates':'postsecondary graduation',
 'post secondary':'postsecondary','ready for college':'postsecondary college career',
 'sel':'emotional support social emotional','social emotional':'emotional support',
 'emotionally':'emotional support','emotional':'emotional support',
 'mental health':'emotional support','belonging':'emotional support','behavior':'emotional support',
 'principal':'leading implementation leaders','principals':'leading implementation leaders',
 'administrator':'leading implementation leaders','admin':'leading implementation leaders',
 'school leader':'leading implementation leaders','school leaders':'leading implementation leaders',
 'leadership':'leading implementation leaders',
 'professional development':'training deck','pd':'training deck','training':'training deck',
 'workshop':'training deck','instructional coach':'coaching','coach':'coaching','coaches':'coaching',
 'research':'evidence research publication','evidence':'evidence research publication',
 'study':'evidence research publication','studies':'evidence research publication',
 'results':'evidence impact outcomes','outcomes':'evidence impact outcomes',
 'proof':'evidence impact outcomes','does it work':'evidence impact outcomes',
 'actually works':'evidence impact outcomes','is working':'coaching progress monitoring',
 'it working':'coaching progress monitoring','monitor':'coaching progress monitoring',
 'monitoring':'coaching progress monitoring','track':'coaching progress monitoring',
 'goes wrong':'common pitfalls barriers','go wrong':'common pitfalls barriers',
 'problems':'common pitfalls barriers','problem':'common pitfalls barriers',
 'challenges':'common pitfalls barriers','challenge':'common pitfalls barriers',
 'barriers':'common pitfalls barriers','mistakes':'common pitfalls barriers',
 'pitfalls':'common pitfalls barriers','not working':'common pitfalls barriers',
 'agenda':'agenda protocol','protocol':'agenda protocol','template':'template tool',
 'checklist':'tool checklist','self assessment':'self assessment tool','rubric':'rubric criteria',
 'video':'video','deck':'deck training','slides':'deck training'
};

function sNorm(s){return String(s==null?'':Array.isArray(s)?s.join(' '):s).toLowerCase().replace(/[^a-z0-9\s]+/g,' ').replace(/\s+/g,' ').trim();}
/* The old search deleted punctuation rather than replacing it with a space,
   which is the only reason "coplanning" ever matched "co-planning". Keeping a
   squashed copy of every hyphenated word preserves that instead of trading one
   working query for another. */
function sSquash(s){return String(s==null?'':Array.isArray(s)?s.join(' '):s).toLowerCase().replace(/[^a-z0-9\s]+/g,'');}
/* Light suffix stripping so "planning" and "plan" land on one token. Linguistic
   correctness matters less than applying the same rule to query and index. */
function sStem(w){
 if(w.length<4)return w;
 if(/ss$/.test(w))return w;
 w=w.replace(/ies$/,'y').replace(/s$/,'');
 w=w.replace(/ing$/,'').replace(/ed$/,'');
 return w.replace(/([^aeiou])\1$/,'$1');
}
function sToks(s){return sNorm(s).split(' ').filter(Boolean);}
function sContent(ws){return ws.filter(w=>!SEARCH_STOP.has(w)&&w.length>1);}
function sFieldToks(v){
 const out=sContent(sToks(v)).map(sStem);
 const raw=String(v==null?'':Array.isArray(v)?v.join(' '):v).toLowerCase();
 for(const m of raw.match(/[a-z0-9]+(?:[-'][a-z0-9]+)+/g)||[]){
  const sq=sSquash(m); if(sq.length>3)out.push(sStem(sq));
 }
 return out;
}
/* Where a term appears matters more than how often it appears. */
/* who_for is weighted above summary because it is short and curated: every word
   in it is a role a visitor might use to describe themselves ("instructional
   coach", "paraeducator", "counselor"), which is vocabulary that appears
   nowhere else in the sheet. It was left out of this list when the search was
   rewritten, because the column was empty on all 119 rows and indexing it
   would have changed nothing. */
const S_FIELDS=[['title',6],['module',4],['section',4],['who_for',3],['format',2],['summary',2],['body',1],['why',1],['quote',1]];
const S_K1=1.4, S_B=0.72;   /* BM25 saturation and length normalisation */

function sDoc(get){
 const wf=new Map(); let dl=0;
 for(const [f,w] of S_FIELDS){
  const ts=sFieldToks(get(f)); dl+=w*ts.length;
  for(const t of ts) wf.set(t,(wf.get(t)||0)+w);
 }
 return {wf,dl};
}

let SIDX=null;
function buildSearchIndex(){
 const resources=DATA.resources, sections=DATA.sections||[];
 /* The site already ranks its own sections: the IGNITE practice toolkits carry
    the top nav, the Research-to-Impact Library is cross-cutting background.
    Search honours the same hierarchy — without it the Library wins almost every
    query, because its rows are the ones carrying body/why/quote text and so
    out-match the flagship toolkits on sheer word count. */
 const flagship=new Set(sections.filter(s=>s.homepage).map(s=>s.name));
 const docs=resources.map(r=>{
  const {wf,dl}=sDoc(f=>r[f]);
  return {r,wf,dl,hay:S_FIELDS.map(([f])=>sNorm(r[f])).join(' '),title:sNorm(r.title)};
 });
 const df=new Map();
 for(const d of docs) for(const k of d.wf.keys()) df.set(k,(df.get(k)||0)+1);
 const N=docs.length||1;
 const avgdl=docs.reduce((a,d)=>a+d.dl,0)/N||1;
 const idf=k=>Math.log(1+(N-(df.get(k)||0)+0.5)/((df.get(k)||0)+0.5));
 /* Modules are destinations in their own right: "how do I get started with
    repeated reading" is asking for a page, not a file. */
 const mods=[];
 for(const s of sections) for(const m of (s.modules||[])){
  const f={title:m.name,module:m.name,section:s.name,format:'',summary:m.intro||'',body:'',why:'',quote:''};
  const {wf,dl}=sDoc(k=>f[k]);
  mods.push({section:s.name,module:m.name,intro:m.intro||'',wf,dl,hay:sNorm(m.name)+' '+sNorm(s.name)+' '+sNorm(m.intro)});
 }
 const names=[];
 for(const s of sections){
  names.push({section:s.name,text:sNorm(s.name),sq:sSquash(s.name)});
  for(const m of (s.modules||[])) names.push({section:s.name,module:m.name,text:sNorm(m.name),sq:sSquash(m.name)});
 }
 SIDX={docs,mods,idf,vocab:new Set(df.keys()),avgdl,names,flagship,
       secTokens:sections.map(s=>[s.name,[...new Set(sFieldToks(s.name))]])};
 return SIDX;
}

function sLev1(a,b){
 if(Math.abs(a.length-b.length)>1)return false;
 let i=0,j=0,e=0;
 while(i<a.length&&j<b.length){
  if(a[i]===b[j]){i++;j++;continue;}
  if(++e>1)return false;
  if(a.length>b.length)i++; else if(b.length>a.length)j++; else {i++;j++;}
 }
 return e+(a.length-i)+(b.length-j)<=1;
}
function sExpand(q,vocab){
 const s=' '+sNorm(q)+' ', extra=[];
 for(const k of Object.keys(SEARCH_SYN).sort((a,b)=>b.length-a.length)){
  if(s.includes(' '+k+' ')) extra.push(...sToks(SEARCH_SYN[k]));
 }
 const terms=new Map();
 for(const w of sContent(sToks(s))){
  terms.set(sStem(w),1);
  const sq=sSquash(w); if(sq!==w&&sq.length>3) terms.set(sStem(sq),1);
 }
 const sq=sSquash(q);
 if(sq.length>3&&vocab&&vocab.has(sStem(sq))) terms.set(sStem(sq),1);
 for(const w of sContent(extra)){ const k=sStem(w); if(!terms.has(k)) terms.set(k,0.55); }
 /* Spelling rescue, only for a word the library has never seen — so a real word
    is never quietly swapped for a different real word. */
 if(vocab) for(const [k,w] of [...terms]){
  if(w===1&&k.length>=5&&!vocab.has(k)){
   for(const v of vocab) if(sLev1(k,v)){ terms.delete(k); terms.set(v,0.9); break; }
  }
 }
 return terms;
}
function sBm25(wf,dl,terms,idf,avgdl,hay,phrase,title){
 let sc=0,hit=0;
 for(const [k,w] of terms){
  const f=wf.get(k); if(!f)continue;
  sc+=w*idf(k)*(f*(S_K1+1))/(f+S_K1*(1-S_B+S_B*dl/avgdl));
  if(w===1)hit++;
 }
 if(!sc)return{sc:0,hit:0};
 if(phrase.length>3){
  if(title&&title.includes(phrase))sc*=2.4;
  else if(hay.includes(phrase))sc*=1.35;
 }
 return {sc,hit};
}
function searchAll(q){
 const idx=SIDX||buildSearchIndex();
 const phrase=sNorm(q), sqq=sSquash(q);
 const terms=sExpand(q,idx.vocab);
 if(!terms.size)return{resources:[],modules:[],terms};
 const literal=[...terms.values()].filter(v=>v===1).length;
 /* The site's own taxonomy is the strongest signal it has: someone typing a
    section or module name is not guessing. */
 const named=idx.names.filter(n=>n.text&&(phrase.includes(n.text)||(n.sq.length>4&&sqq.includes(n.sq))));
 const namedSec=new Set(named.map(n=>n.section));
 const namedMod=new Set(named.filter(n=>n.module).map(n=>n.section+'|'+n.module));
 /* Partial credit where a query half-matches a section's own name: "proof this
    actually works" expands to evidence+impact, which is the name of the section
    holding exactly that. The exact-phrase rule misses it, the words arriving
    separately. */
 const secHit=new Map();
 for(const [name,tk] of idx.secTokens){
  if(!tk.length)continue;
  const got=tk.filter(t=>terms.has(t)).length;
  if(got)secHit.set(name,1+0.55*(got/tk.length));
 }
 let rs=idx.docs.map(d=>{
  const b=sBm25(d.wf,d.dl,terms,idx.idf,idx.avgdl,d.hay,phrase,d.title);
  if(b.sc){
   if(namedSec.has(d.r.section))b.sc*=2.6;
   if(namedMod.has(d.r.section+'|'+d.r.module))b.sc*=1.6;
   if(idx.flagship.has(d.r.section))b.sc*=1.45;
   if(secHit.has(d.r.section))b.sc*=secHit.get(d.r.section);
  }
  return {r:d.r,...b};
 }).filter(x=>x.sc>0);
 /* Coverage: at least half the words the visitor actually typed must land.
    Far looser than the old strict AND — which is why a question can no longer
    return nothing — but tight enough that one incidental word cannot drag in a
    third of the library. */
 if(literal>=2){
  const need=Math.max(1,Math.ceil(literal*0.5));
  const kept=rs.filter(x=>x.hit>=need);
  if(kept.length>=3)rs=kept;
 }
 if(rs.length){
  const top=Math.max(...rs.map(x=>x.sc));
  rs=rs.filter(x=>x.sc>=top*(literal>=3?0.34:0.3));
 }
 rs.sort((a,b)=>((b.r.published?1:0)-(a.r.published?1:0))||(b.sc-a.sc));
 let ms=idx.mods.map(m=>{
  const b=sBm25(m.wf,m.dl,terms,idx.idf,idx.avgdl,m.hay,phrase,sNorm(m.module));
  if(b.sc){
   if(namedSec.has(m.section))b.sc*=2.2;
   if(idx.flagship.has(m.section))b.sc*=1.45;
   if(secHit.has(m.section))b.sc*=secHit.get(m.section);
  }
  return {m,...b};
 }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc);
 if(ms.length){ const top=ms[0].sc; ms=ms.filter(x=>x.sc>=top*0.6).slice(0,3); }
 return {resources:rs.map(x=>x.r),modules:ms.map(x=>x.m),terms};
}
/* Kept for the live-edit panel and anything else expecting the old shape. */
function searchResources(q){return searchAll(q).resources;}

/* A line of the resource's own words with the matched terms marked, so a result
   explains itself instead of asking the reader to take it on trust. Built by
   walking words rather than character offsets, because normalising for the
   match would shift every position in the raw string. */
function matchSnippet(r,terms){
 const src=String(r.summary||'').trim()||String(r.body||'').trim();
 if(!src)return '';
 const parts=src.split(/(\s+)/);
 let hit=-1;
 for(let i=0;i<parts.length;i++){
  const w=sStem(sNorm(parts[i]));
  if(w&&terms.has(w)&&terms.get(w)===1){hit=i;break;}
 }
 if(hit<0)return '';
 const start=Math.max(0,hit-14), end=Math.min(parts.length,hit+30);
 const out=parts.slice(start,end).map(p=>{
  const w=sStem(sNorm(p));
  return (w&&terms.has(w))?'<mark>'+esc(p)+'</mark>':esc(p);
 }).join('');
 return (start>0?'&hellip;':'')+out+(end<parts.length?'&hellip;':'');
}

function runSearch(q){
 const list=document.getElementById('matchList'), count=document.getElementById('matchCount');
 if(!(q||'').trim()){
  list.innerHTML='<div class="matchhint">Start typing to search every guide, template, and tool on the site &mdash; or ask a question in your own words.</div>';
  count.textContent=''; renderWhere(null); return;
 }
 const {resources:res,modules:mods,terms}=searchAll(q);
 renderWhere(mods.length?{mods,terms}:null);
 count.textContent=res.length?`(${res.length})`:'';
 if(!res.length){ list.innerHTML='<div class="matchhint">Nothing matched that. Try a practice name, a format, or fewer words.</div>'; return; }
 const CAP=25;
 const more=res.length>CAP?`<div class="matchhint">Showing the ${CAP} closest of ${res.length}. Add a word to narrow it.</div>`:'';
 list.innerHTML=more+res.slice(0,CAP).map(r=>{
  const sn=matchSnippet(r,terms);
  return `<a class="matchrow ${r.published?'':'soon'}" href="#" data-go="module:${escAttr(r.section)}|${escAttr(r.module)}">${icon(r.format,16)}<span class="mrtxt"><span class="mrtitle">${esc(r.title)}</span><span class="mrmeta">${esc(r.section)} &middot; ${esc(r.module)} &middot; ${esc(r.format)}</span>${sn?`<span class="mrsnip">${sn}</span>`:''}</span><span class="dot ${r.published?'ok':'soon'}" title="${r.published?'Available':'Coming soon'}"></span></a>`;
 }).join('');
}

/* "Where to start" — the panel's answer to a question. It is the best-matching
   module, shown in Marshall's own words: the module intro straight from the
   sheet, not a paraphrase of it. Nothing is generated, so there is nothing to
   get wrong, and the reader gets the sentence a model would have been
   rewriting anyway. */
function renderWhere(d){
 const card=document.getElementById('ansCard'), b=document.getElementById('ansBody');
 if(!d||!d.mods.length){ card.hidden=true; b.innerHTML=''; return; }
 card.hidden=false;
 const top=d.mods[0];
 const intro=String(top.intro||'').trim();
 const rest=d.mods.slice(1);
 b.innerHTML=`<a class="wherecard" href="#" data-go="module:${escAttr(top.section)}|${escAttr(top.module)}">`
  +`<span class="wheresec">${esc(top.section)}</span>`
  +`<span class="wheremod">${esc(top.module)} <span class="arr">&rarr;</span></span>`
  +(intro?`<span class="whereintro">${esc(intro.length>260?intro.slice(0,257).replace(/\s+\S*$/,'')+'…':intro)}</span>`:'')
  +`</a>`
  +(rest.length?`<div class="wherealso">Also: ${rest.map(m=>`<a href="#" data-go="module:${escAttr(m.section)}|${escAttr(m.module)}">${esc(m.module)}</a>`).join(' &middot; ')}</div>`:'');
}

const askWrap=document.getElementById('askWrap');
const findInputEl=document.getElementById('findInput');
function askOpen(o){askWrap.classList.toggle('open',o);askWrap.setAttribute('aria-hidden',o?'false':'true');if(o){runSearch(findInputEl.value);setTimeout(()=>findInputEl.focus(),60);}}
findInputEl.addEventListener('input',()=>{runSearch(findInputEl.value);});
document.getElementById('findBtn').addEventListener('click',()=>askOpen(true));
document.addEventListener('click',e=>{
 if(e.target.closest('[data-ask-close]')){askOpen(false);return;}
 const soon=e.target.closest('[data-dd-soon]');
 if(soon){e.preventDefault();toast('These collections arrive in the second wave after launch.');return;}
 const tog=e.target.closest('[data-dd]');
 const all=document.querySelectorAll('nav.main .dd');
 if(tog){e.preventDefault();const par=tog.closest('.dd');all.forEach(d=>{if(d!==par)d.classList.remove('open')});if(par){const opening=!par.classList.contains('open');par.classList.toggle('open');if(opening){/* menu may open under the resting cursor — suppress item hover until the mouse actually moves */document.body.classList.add('ddNoHover');const clr=()=>{document.body.classList.remove('ddNoHover');document.removeEventListener('mousemove',clr);};document.addEventListener('mousemove',clr);}}return;}
 if(!e.target.closest('.dd'))all.forEach(d=>d.classList.remove('open'));
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){askOpen(false);gateClose();closeVideo();}});

/* ---- soft email ask (gated resources -> HubSpot) ---- */
let gatePendingLink='';
let gateReturnFocus=null;
function openUrl(u){ if(u) window.open(u,'_blank','noopener'); }
document.addEventListener('click',e=>{const o=e.target.closest('[data-open]');if(o){e.preventDefault();openUrl(o.getAttribute('data-open'));}});

/* ---- inline Vimeo players (intro/module videos + resource "Watch") ---- */
let vReturnFocus=null;
// Turn any Vimeo share/player URL into a player.vimeo.com embed src (keeps the privacy
// hash for unlisted videos). Returns '' if it isn't a Vimeo link.
function vimeoEmbed(url){
 if(!url) return '';
 url=String(url).trim();
 let m=url.match(/player\.vimeo\.com\/video\/(\d+)/)
     ||url.match(/vimeo\.com\/(?:channels\/[\w-]+\/|groups\/[\w-]+\/videos\/)?(\d+)/);
 if(!m) return '';
 const id=m[1];
 let hash='';
 const hp=url.match(new RegExp('\\/'+id+'\\/([0-9a-zA-Z]+)')); if(hp) hash=hp[1]; // vimeo.com/ID/HASH (unlisted)
 const hq=url.match(/[?&]h=([0-9a-zA-Z]+)/); if(hq) hash=hq[1];                   // ?h=HASH
 return 'https://player.vimeo.com/video/'+id+(hash?('?h='+hash):'');
}
// Inline 16:9 player for a section/module intro video; '' when there's no (Vimeo) video.
function videoBlock(url,meta){
 const src=vimeoEmbed(url);
 if(!src) return '';
 // The slot shows the video's own still (fetched at build time, see
 // fetchVimeoPosters in build.js) and loads the player on click. With no still
 // — a fixtures build, or Vimeo did not answer — it is a navy panel with the
 // same play button, never a black box.
 const poster=meta&&meta.poster||'';
 const d=meta&&meta.duration||0;
 const dur=d?`${Math.floor(d/60)}:${String(d%60).padStart(2,'0')}`:'';
 return `<div class="mediaslot"><button class="vplay" data-play="${escAttr(src)}" aria-label="Play the introduction video${dur?' ('+dur+')':''}">${poster?`<img class="vposter" src="${escAttr(poster)}" alt="" decoding="async"/>`:''}<span class="vbtn" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4v16l13-8z"/></svg></span><span class="vcap">Watch the introduction${dur?' &middot; '+dur:''}</span></button></div>`;
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button.vplay[data-play]'); if(!b)return;
 const src=b.getAttribute('data-play'), sep=src.indexOf('?')>=0?'&':'?';
 const d=document.createElement('div'); d.className='vplay';
 d.innerHTML=`<iframe src="${escAttr(src+sep+'autoplay=1')}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="Intro video"></iframe>`;
 b.replaceWith(d);
});
function openVideo(url){
 const src=vimeoEmbed(url);
 if(!src){openUrl(url);return;} // not Vimeo — fall back to opening the link
 const sep=src.indexOf('?')>=0?'&':'?';
 document.getElementById('vframe').innerHTML=`<iframe src="${escAttr(src+sep+'autoplay=1')}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="Video"></iframe>`;
 const v=document.getElementById('vmodal');v.classList.add('open');v.setAttribute('aria-hidden','false');
 vReturnFocus=document.activeElement;const x=v.querySelector('.vmodal-x');if(x)x.focus();
}
function closeVideo(){
 const v=document.getElementById('vmodal');if(!v.classList.contains('open'))return;
 v.classList.remove('open');v.setAttribute('aria-hidden','true');
 document.getElementById('vframe').innerHTML=''; // stop playback
 if(vReturnFocus&&vReturnFocus.focus){vReturnFocus.focus();vReturnFocus=null;}
}
document.getElementById('vmodal').addEventListener('click',e=>{if(e.target.id==='vmodal')closeVideo();});
document.addEventListener('click',e=>{const b=e.target.closest('[data-video]');if(b){e.preventDefault();openVideo(b.getAttribute('data-video'));}});
function askEmail(title,link){
 gatePendingLink=link||'';
 document.getElementById('gateRes').textContent=title?('“'+title+'”'):'this resource';
 const host=document.getElementById('gateForm');
 const pid=DATA.site.hubspot_portal, fid=DATA.site.hubspot_form;
 if(pid&&fid&&window.hbspt){
  host.innerHTML='<div id="hsFormTarget"></div>';
  window.hbspt.forms.create({portalId:pid,formId:fid,region:DATA.site.hubspot_region||'na1',target:'#hsFormTarget',onFormSubmitted:()=>gateProceed()});
 } else {
  host.innerHTML='<div class="gate-ph">Email capture (HubSpot) appears here once <b>hubspot_portal_id</b> and <b>hubspot_form_id</b> are set on the Site tab. Until then, this is a placeholder — “just download” still works.</div>';
 }
 const g=document.getElementById('gate');g.classList.add('open');g.setAttribute('aria-hidden','false');
 gateReturnFocus=document.activeElement;const x=g.querySelector('.gate-x');if(x)x.focus();
}
function gateClose(){const g=document.getElementById('gate');if(!g.classList.contains('open'))return;g.classList.remove('open');g.setAttribute('aria-hidden','true');if(gateReturnFocus&&gateReturnFocus.focus){gateReturnFocus.focus();gateReturnFocus=null;}}
function gateProceed(){const u=gatePendingLink;gateClose();if(u)openUrl(u);else toast('File link not set yet — add a link_url in the sheet');}
document.getElementById('gate').addEventListener('click',e=>{if(e.target.id==='gate')gateClose();});
document.addEventListener('click',e=>{const b=e.target.closest('[data-gate]');if(b){e.preventDefault();askEmail(b.getAttribute('data-title'),b.getAttribute('data-link'));}});
/* Load the HubSpot embed script only when IDs are configured (no surprise calls before setup). */
if(DATA.site.hubspot_portal&&DATA.site.hubspot_form){
 const hs=document.createElement('script');hs.src='https://js.hsforms.net/forms/embed/v2.js';hs.async=true;document.head.appendChild(hs);
}

document.getElementById('footAttr').textContent=DATA.site.footer;
document.getElementById('footLic').textContent=DATA.site.license;
applyHash();
</script>
</body>
