# Rebuilds the site from the Google Sheet without a code change.
# - Weekly on a schedule (Mondays) — keeps the site fresh without burning credits.
# - On demand: Actions tab -> "Scheduled rebuild" -> Run workflow (use this right
#   after you edit the Sheet to publish immediately).
# Requires repo secret NETLIFY_BUILD_HOOK (Settings -> Secrets and variables -> Actions).
#
# Why weekly, not nightly: each triggered build is a Netlify *production deploy*
# (15 credits under credit-based pricing). Nightly (~450/mo) overran the Free plan's
# 300 credits; weekly (~60/mo) stays well within it. Bump the cron back up only on a
# paid/Open-Source plan, or just run it on demand whenever the Sheet changes.
#
# Why the keepalive step: GitHub disables scheduled workflows after 60 days with no
# pushes to the repo, and it only warns you once by email. When that happens nothing
# fails loudly — the site just quietly stops picking up Sheet edits. The keepalive
# pushes a timestamp each run so the schedule sustains itself. A push made with
# GITHUB_TOKEN does not re-trigger GitHub Actions, so this cannot loop.
#
# It DOES, however, reach Netlify: Netlify builds from a push webhook, which is
# delivered no matter who pushed. Until 19 Nov 2026 that meant every run produced *two*
# production deploys seconds apart — the build hook's, plus the keepalive push's —
# at roughly 30 credits a run instead of 15. Confirmed in the deploy log:
#
#   00:02:15Z  production  Deploy triggered by hook: Sheet Rebuild
#   00:02:19Z  production  Keepalive: record scheduled rebuild timestamp
#
# Hence the skip marker on the keepalive commit below. Netlify's rule
# (https://docs.netlify.com/deploy/manage-deploys/manage-deploys-overview):
# "To avoid generating a branch or production deploy for a commit pushed directly
# to a branch, add [skip ci] or [skip netlify] anywhere in the Git commit message."
# The keepalive IS pushed directly to main, so the marker applies.
#
# We use the netlify-specific spelling, not the generic one, because the generic
# one would ALSO stop this repo's GitHub Actions CI from running on that commit.
#
# The hook's deploy — the one that actually republishes the Sheet — is unaffected:
# a hook deploy has no commit message to skip on. Don't remove the marker without
# re-checking the credit maths.
#
# Note the asymmetry, which bit us once: for a PULL REQUEST, Netlify reads the
# marker from the PR *title*, not from any commit message. A commit marked here
# will still get a Deploy Preview. That is expected, not a broken marker.
name: Scheduled rebuild

on:
  schedule:
    - cron: "0 9 * * 1"   # 09:00 UTC every Monday (~2-5am US). Adjust as you like.
  workflow_dispatch: {}    # manual "Run workflow" button — publishes immediately

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # the keepalive and document-text steps both push to main
    steps:
      # Checked out first because the document-text refresh below needs the repo.
      # Every later step is `if: always()`, so a failed checkout or refresh still
      # lets the rebuild fire and the schedule stay alive.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: "20"

      # Search looks inside the linked PDFs, Docs and decks (docs/search.md). Their
      # text is extracted here and committed under content/, because the Netlify
      # build has no PDF tooling and should not download ~200 MB of files per build.
      # Only files whose Last-Modified or size changed are re-downloaded, so a
      # normal week costs a HEAD request per file.
      #
      # This runs BEFORE the build hook so the deploy it triggers already includes
      # any new text. The commit carries the skip marker for the same reason the
      # keepalive does (see header): pushed without it, it would fire a second
      # production deploy alongside the hook's.
      #
      # continue-on-error: a Drive outage must cost us one week of fresh document
      # text, not the rebuild itself. The tool keeps the cached copy of anything it
      # could not fetch, so a bad run never shrinks the index.
      - name: Refresh document text for search
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          node build.js > /dev/null
          node tools/index-files.mjs | tee index-report.txt
          {
            echo '## Document text for search'
            echo '```'
            cat index-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f index-report.txt

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "Document text unchanged."
            exit 0
          fi
          git commit -m "Search: refresh extracted document text [skip netlify]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          echo "Document text updated; the build hook below will publish it."

      - name: Trigger Netlify build hook
        if: always()
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "::error::NETLIFY_BUILD_HOOK secret is not set. Add it in Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi
          curl -fsSL -X POST -d '{}' "$NETLIFY_BUILD_HOOK"
          echo "Build hook triggered."

      # Runs even if the hook above failed — a broken rebuild should still keep its
      # schedule alive, so you can fix the secret rather than also having to re-enable
      # the workflow.
      - name: Keep the schedule alive
        if: always()
        run: |
          set -euo pipefail
          {
            echo "Last scheduled rebuild: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "Written automatically by .github/workflows/rebuild.yml. This file exists"
            echo "only so the repo keeps seeing pushes: GitHub disables scheduled workflows"
            echo "after 60 days of inactivity, which would silently stop the site from"
            echo "picking up Google Sheet edits. Safe to leave alone; do not delete."
          } > .github/last-rebuild.txt

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-rebuild.txt

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          # The marker stops Netlify building this commit. Without it the push below
          # fires a second, redundant production deploy (see header comment). Use the
          # netlify-specific spelling so GitHub Actions CI is not skipped too.
          git commit -m "Keepalive: record scheduled rebuild timestamp [skip netlify]"
          # Rebase in case main moved while this run was queued.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          echo "Keepalive pushed; the 60-day inactivity clock is reset."
